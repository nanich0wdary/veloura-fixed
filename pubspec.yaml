name: veloura
description: A premium privacy-first peer-to-peer couple communication app.
publish_to: 'none'
version: 3.0.0+13

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1
  cupertino_icons: ^1.0.8

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.4
  http: ^1.2.1

  # Crypto — AES-256-GCM + PBKDF2 + HMAC
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.9.1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Device
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.1

  # Google Sign-In + Drive backup (zero server cost)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
