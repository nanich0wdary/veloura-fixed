name: Build Veloura APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.0'
  JAVA_VERSION: '17'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_VERSION: '2.0.0'

jobs:
  build:
    name: 🔨 Build APKs — v3.0.0
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # ── Optional release signing ────────────────────────────
      - name: Decode keystore (if secrets present)
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --ignore-garbage --decode > android/app/release.keystore
          echo "SIGNING=true" >> "$GITHUB_OUTPUT"

      - name: Write key.properties
        if: steps.keystore.outputs.SIGNING == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties

      - name: Patch build.gradle.kts for release signing
        if: steps.keystore.outputs.SIGNING == 'true'
        run: |
          GRADLE=android/app/build.gradle.kts
          sed -i '1s/^/import java.util.Properties\n/' "$GRADLE"
          cat > /tmp/signing_block.txt << 'SIGNING_EOF'
              signingConfigs {
                  create("release") {
                      val props = Properties()
                      val kf = rootProject.file("key.properties")
                      if (kf.exists()) { props.load(kf.inputStream()) }
                      storeFile     = file(props.getProperty("storeFile", ""))
                      storePassword = props.getProperty("storePassword", "")
                      keyAlias      = props.getProperty("keyAlias", "")
                      keyPassword   = props.getProperty("keyPassword", "")
                  }
              }
          SIGNING_EOF
          sed -i "/    buildTypes {/r /tmp/signing_block.txt" "$GRADLE"
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' "$GRADLE"
          echo "=== Patched build.gradle.kts ===" && cat "$GRADLE"

      # ── Build ────────────────────────────────────────────────
      - name: Build arm64 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Build arm32 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm \
            --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      # ── Collect & name APKs ──────────────────────────────────
      - name: Collect APKs
        run: |
          TAG="${{ github.ref_name }}"
          [[ "$TAG" == refs/* || -z "$TAG" ]] && TAG="$(echo ${{ github.sha }} | cut -c1-7)"
          VERSION="${{ env.APP_VERSION }}-${TAG}"
          mkdir -p dist
          SRC="build/app/outputs/flutter-apk"
          cp "$SRC/app-release.apk"             "dist/veloura-${VERSION}-universal.apk"
          cp "$SRC/app-arm64-v8a-release.apk"   "dist/veloura-${VERSION}-arm64.apk"
          cp "$SRC/app-armeabi-v7a-release.apk" "dist/veloura-${VERSION}-arm32.apk"
          echo "── APKs built ──"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veloura-v${{ env.APP_VERSION }}-apks-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: 🚀 GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: veloura-v${{ env.APP_VERSION }}-apks-${{ github.run_number }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Veloura v${{ env.APP_VERSION }} — ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Veloura v${{ env.APP_VERSION }} — ${{ github.ref_name }}

            ### What's new in v2.0.0
            - ✅ AES-256-GCM encryption (replaces AES-CBC)
            - ✅ PBKDF2 key derivation (100k iterations)
            - ✅ HMAC-SHA256 integrity verification
            - ✅ Replay attack protection
            - ✅ Versioned Drive sync with conflict resolution
            - ✅ UUID deduplication — never lose messages
            - ✅ Background sync every 15 minutes
            - ✅ Biometric lock support
            - ✅ Push notifications for new messages
            - ✅ Hive schema migration & corruption recovery
            - ✅ Package name mismatch fixed (crash on open)

            ### 📲 Install
            1. Download **`veloura-*-arm64.apk`** (recommended for modern phones)
            2. Phone: Settings → Security → Install unknown apps → Allow
            3. Open APK → Install
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
